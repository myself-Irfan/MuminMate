{% extends "registration/base_card.html" %}

{% block title %}Log in{% endblock %}

{% block card %}
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
  <p class="note"><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
  <p class="note">New here? <a href="{% url 'signup' %}">Create an account</a>.</p>
  <p class="note">Staff? Use the <a href="{% url 'admin:login' %}">admin login</a>.</p>
{% endblock %}
