{% extends "base.html" %}

{% block title %}Log in - MuminMate{% endblock %}

{% block content %}
  <h1>Log in</h1>
  <form method="post">
    {% csrf_token %}
    {{ form }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Log in</button>
  </form>
  <p>Staff? Use the <a href="{% url 'admin:login' %}">admin login</a>.</p>
{% endblock %}
