<dialog id="delete-dialog" class="confirm-dialog" aria-labelledby="delete-dialog-title">
  <article>
    <h2 id="delete-dialog-title">Delete this chat?</h2>
    <p>&ldquo;<span data-delete-title></span>&rdquo; will be removed from your chats.</p>
    <footer>
      <button type="button" class="cancel" commandfor="delete-dialog" command="close">Cancel</button>
      <button type="button" class="danger" data-delete-confirm>Delete</button>
    </footer>
  </article>
</dialog>
