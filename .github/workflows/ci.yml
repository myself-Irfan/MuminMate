name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly: new advisories (pip-audit, Trivy) fail it on a week nothing changed.
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SECRET_KEY: ci-only-not-a-secret
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: localhost
  DJANGO_PUBLIC_URL: http://localhost:8000
  POSTGRES_DB: muminmate
  POSTGRES_USER: muminmate
  POSTGRES_PASSWORD: muminmate
  POSTGRES_HOST: localhost
  POSTGRES_PORT: "5432"
  POSTGRES_POOL_TIMEOUT_SECONDS: "5"
  RABBITMQ_HOST: localhost
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: muminmate
  RABBITMQ_PASSWORD: ci-only-not-a-secret
  RABBITMQ_VHOST: muminmate
  DJANGO_HTTPS: "false"
  DJANGO_HSTS_SECONDS: "0"
  DJANGO_SESSION_IDLE_MINUTES: "180"
  DJANGO_SESSION_ABSOLUTE_HOURS: "12"
  DJANGO_PASSWORD_RESET_TIMEOUT_HOURS: "72"
  DJANGO_LOGGING: '{"level":"INFO","format":"json"}'
  DJANGO_THROTTLE_LIMITS: '{"login":{"email_ip_max_events":5,"email_ip_window_seconds":900,"ip_max_events":100,"ip_window_seconds":900,"email_max_events":20,"email_window_seconds":3600,"email_backoff_seconds":60},"password_reset":{"email_max_events":3,"email_window_seconds":3600,"email_cooldown_seconds":300,"ip_max_events":100,"ip_window_seconds":3600},"signup":{"ip_max_events":50,"ip_window_seconds":3600},"verification_email":{"email_max_events":3,"email_window_seconds":3600,"email_cooldown_seconds":300}}'
  DJANGO_EMAIL: '{"host":"localhost","port":1025,"use_tls":false,"timeout_seconds":10,"default_from_email":"MuminMate <no-reply@localhost>"}'
  DJANGO_EMAIL_HOST_USER: ""
  DJANGO_EMAIL_HOST_PASSWORD: ""

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - &setup-uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: make typecheck

  # Own job: a new advisory can fail it on a day nothing changed.
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - *checkout
      - *setup-uv
      - name: Audit Dependencies
        run: >-
          uv export --color never --locked --no-emit-project --format requirements-txt --quiet
          | uvx pip-audit==2.10.1 --requirement /dev/stdin --disable-pip --progress-spinner off

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services: &services
      db:
        image: paradedb/paradedb:0.25.11-pg17@sha256:78d65750f0f88a56548526201bcab9910f83b90fe929cdbf979890f3f80b0f95
        env:
          POSTGRES_DB: muminmate
          POSTGRES_USER: muminmate
          POSTGRES_PASSWORD: muminmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muminmate -d muminmate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      rabbitmq:
        image: rabbitmq:4.3.6-management@sha256:8d0592c8f13b9ca76d844aa269f54461503223f36d0bf955859608d78baaf8fb
        env:
          RABBITMQ_DEFAULT_USER: muminmate
          RABBITMQ_DEFAULT_PASS: ci-only-not-a-secret
          RABBITMQ_DEFAULT_VHOST: muminmate
        ports:
          - 5672:5672
        options: >-
          --health-cmd "bash -c '</dev/tcp/localhost/5672'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - *checkout
      - *setup-uv
      - run: uv sync --locked
      - run: uv run python manage.py makemigrations --check --dry-run
      - name: Test
        run: uv run pytest --cov --cov-report=term --cov-report=html
      # Report only; the Test step enforces fail_under.
      - name: Coverage Summary
        if: ${{ !cancelled() && hashFiles('.coverage') != '' }}
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Coverage Report
        if: ${{ !cancelled() && hashFiles('htmlcov/index.html') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services: *services
    steps:
      - *checkout
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      # Layers cached in GitHub's Actions cache; load: the image goes on to docker save and run.
      - name: Build Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          tags: muminmate:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The settings production runs with, checked in the image that ships.
      - name: Deploy Check
        run: |
          docker run --rm --env-file <(env | grep -E '^(DJANGO|POSTGRES|RABBITMQ)_') \
            --env DJANGO_HTTPS=true --env DJANGO_PUBLIC_URL=https://localhost \
            --env DJANGO_HSTS_SECONDS=3600 \
            --env DJANGO_SECRET_KEY=ci-deploy-check-only-0123456789abcdefghijklmnopqrstuvwxyz \
            muminmate python manage.py check --deploy --fail-level WARNING
      # A saved tar, not the Docker socket: the scanner gets no access to the daemon.
      - name: Scan Image
        run: |
          docker save muminmate:latest --output image.tar
          docker run --rm --volume "$PWD/image.tar:/image.tar:ro" \
            aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa \
            image --input /image.tar --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress
      - &start-web
        name: Start Web
        run: |
          docker run --rm --network host --env-file <(env | grep -E '^(DJANGO|POSTGRES|RABBITMQ)_') \
            muminmate python manage.py migrate --noinput
          docker run --detach --name web --network host \
            --env-file <(env | grep -E '^(DJANGO|POSTGRES|RABBITMQ)_') muminmate
          curl --fail --retry 10 --retry-delay 1 --retry-all-errors \
            http://localhost:8000/api/health/ready
      - name: Smoke Test Worker
        run: |
          docker run --detach --name worker --network host \
            --env-file <(env | grep -E '^(DJANGO|POSTGRES|RABBITMQ)_') \
            muminmate celery -A config --quiet worker -Q default,email -n default@%h --concurrency 2
          for _ in $(seq 10); do
            docker exec worker celery -A config inspect ping --timeout 5 && exit 0
          done
          exit 1
      - name: Smoke Test Static Files
        run: |
          assets=$(curl --fail --silent --show-error http://localhost:8000/accounts/login/ \
            | grep -oE '(href|src)="/static/[^"]+"' | cut -d'"' -f2)
          [ -n "$assets" ] || { echo "Login page references no static files" >&2; exit 1; }
          for asset in $assets; do
            curl --fail --silent --show-error --output /dev/null "http://localhost:8000$asset"
          done
      - name: Upload Image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: image
          path: image.tar
          retention-days: 1
      - &web-logs
        name: Web Logs
        if: failure()
        run: docker logs web || true
      - name: Worker Logs
        if: failure()
        run: docker logs worker || true

  load_test:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services: *services
    steps:
      - *checkout
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: image
      - run: docker load --input image.tar
      - *start-web
      - name: Load Test Login
        run: |
          LOAD_PASSWORD=$(openssl rand -hex 16)
          export LOAD_PASSWORD
          docker exec --env LOAD_PASSWORD web python manage.py shell -c "import os
          from django.utils import timezone
          from users.models import User
          User.objects.create_user(
              email='load@example.com',
              password=os.environ['LOAD_PASSWORD'],
              email_verified_at=timezone.now(),
          )"
          mkdir load-test-report
          docker run --rm --network host --user "$(id -u):$(id -g)" \
            --volume "$PWD/load-tests:/scripts:ro" --volume "$PWD/load-test-report:/report" \
            --env LOAD_BASE_URL=http://localhost:8000 --env LOAD_EMAIL=load@example.com \
            --env LOAD_PASSWORD \
            --env K6_WEB_DASHBOARD=true --env K6_WEB_DASHBOARD_EXPORT=/report/report.html \
            grafana/k6:2.3.0@sha256:9c2dee7f8ed74d317e4027c06a10f169b625638189de8d4555d0b3486a5aeb34 \
            run --quiet --summary-export /report/summary.json /scripts/login.js
      # In --summary-export, a threshold that is true was crossed.
      - name: Load Test Summary
        if: ${{ !cancelled() && hashFiles('load-test-report/summary.json') != '' }}
        run: |
          jq --raw-output '
            "## Load Test\n",
            "| Endpoint | p95 | Median | Max | Thresholds |",
            "|---|---|---|---|---|",
            (.metrics | to_entries[] | select(.key | startswith("http_req_duration{endpoint:"))
              | "| \(.key | capture("endpoint:(?<name>[^}]+)").name) "
                + "| \(.value["p(95)"] | round) ms | \(.value.med | round) ms "
                + "| \(.value.max | round) ms "
                + "| \(.value.thresholds | to_entries
                    | map((if .value then "❌ " else "✅ " end) + .key) | join(", ")) |"),
            "\nRequests: \(.metrics.http_reqs.count), failed: \(.metrics.http_req_failed.value * 100) %"
          ' load-test-report/summary.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Load Test Report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: load-test-report
          path: load-test-report/
          retention-days: 14
      - *web-logs

  # The one required check: rulesets keep a fixed name while jobs change.
  checks:
    if: ${{ always() }}
    needs: [lint, audit, test, image, load_test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require Every Job
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "A required job ended with: $result" >&2; exit 1; }
          done
