name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      db:
        image: paradedb/paradedb:0.25.11-pg17
        env:
          POSTGRES_DB: muminmate
          POSTGRES_USER: muminmate
          POSTGRES_PASSWORD: muminmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muminmate -d muminmate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost
      POSTGRES_DB: muminmate
      POSTGRES_USER: muminmate
      POSTGRES_PASSWORD: muminmate
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      DJANGO_HTTPS: "false"
      DJANGO_HSTS_SECONDS: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --locked
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: make typecheck
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: make test
      - name: Deploy Check
        run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_HTTPS: "true"
          DJANGO_HSTS_SECONDS: "3600"
          DJANGO_SECRET_KEY: ci-deploy-check-only-0123456789abcdefghijklmnopqrstuvwxyz
      - name: Build Image
        run: docker build --tag muminmate .
      - name: Smoke Test Image
        run: |
          docker run --rm --network host --env-file <(env | grep -E '^(DJANGO|POSTGRES)_') \
            muminmate python manage.py migrate --noinput
          docker run --detach --name web --network host \
            --env-file <(env | grep -E '^(DJANGO|POSTGRES)_') muminmate
          curl --fail --retry 10 --retry-delay 1 --retry-all-errors \
            http://localhost:8000/api/health/ready
      - name: Web Logs
        if: failure()
        run: docker logs web
