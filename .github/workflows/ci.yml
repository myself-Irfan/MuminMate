name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      db:
        image: paradedb/paradedb:0.25.11-pg17
        env:
          POSTGRES_DB: muminmate
          POSTGRES_USER: muminmate
          POSTGRES_PASSWORD: muminmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U muminmate -d muminmate"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost
      POSTGRES_DB: muminmate
      POSTGRES_USER: muminmate
      POSTGRES_PASSWORD: muminmate
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_POOL_TIMEOUT_SECONDS: "5"
      DJANGO_HTTPS: "false"
      DJANGO_HSTS_SECONDS: "0"
      DJANGO_SESSION_IDLE_SECONDS: "10800"
      DJANGO_SESSION_ABSOLUTE_SECONDS: "43200"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --locked
      - name: Audit Dependencies
        run: >-
          uv export --color never --locked --no-emit-project --format requirements-txt --quiet
          | uvx pip-audit==2.10.1 --requirement /dev/stdin --disable-pip --progress-spinner off
      - run: uv run pre-commit run --all-files --show-diff-on-failure
      - run: make typecheck
      - run: uv run python manage.py makemigrations --check --dry-run
      - name: Test
        run: uv run pytest --cov --cov-report=term --cov-report=html --junitxml=junit.xml
      - name: Test Summary
        if: ${{ !cancelled() && hashFiles('junit.xml') != '' }}
        run: |
          uv run python - >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import xml.etree.ElementTree as ET
          suite = ET.parse("junit.xml").getroot().find("testsuite")
          total, failed, errors, skipped = (
              int(suite.get(key)) for key in ("tests", "failures", "errors", "skipped")
          )
          passed = total - failed - errors - skipped
          print("## Tests\n")
          print("| Passed | Failed | Errors | Skipped | Time |")
          print("|---|---|---|---|---|")
          print(f"| {passed} | {failed} | {errors} | {skipped} | {float(suite.get('time')):.1f}s |")
          print("\n## Coverage\n")
          EOF
          # Report only; the Test step enforces fail_under.
          uv run coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Test Reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-reports
          path: |
            junit.xml
            htmlcov/
          retention-days: 14
      - name: Deploy Check
        run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_HTTPS: "true"
          DJANGO_HSTS_SECONDS: "3600"
          DJANGO_SECRET_KEY: ci-deploy-check-only-0123456789abcdefghijklmnopqrstuvwxyz
      - name: Build Image
        run: docker build --tag muminmate .
      - name: Smoke Test Image
        run: |
          docker run --rm --network host --env-file <(env | grep -E '^(DJANGO|POSTGRES)_') \
            muminmate python manage.py migrate --noinput
          docker run --detach --name web --network host \
            --env-file <(env | grep -E '^(DJANGO|POSTGRES)_') muminmate
          curl --fail --retry 10 --retry-delay 1 --retry-all-errors \
            http://localhost:8000/api/health/ready
      - name: Web Logs
        if: failure()
        run: docker logs web || true
