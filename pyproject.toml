[project]
name = "muminmate"
version = "0.1.0"
description = "Grounded Quran and hadith assistant with cited, confidence-gated answers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja>=1.7,<2",
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "DJ", "S", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]
