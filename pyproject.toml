[project]
name = "muminmate"
version = "0.1.0"
description = "Grounded Quran and hadith assistant with cited, confidence-gated answers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asgiref>=3.12.1,<4",
    "celery>=5.6,<6",
    "django[argon2]>=5.2,<5.3",
    "django-csp>=4.0,<5",
    "django-ninja>=1.7,<2",
    "django-structlog[celery]>=10.1,<11",
    "django-stubs-ext>=6.1,<7",
    "kombu>=5.6,<6",
    "psycopg[binary,pool]>=3.3,<4",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "structlog>=26.1,<27",
    "uvicorn[standard]>=0.54,<1",
    "whitenoise>=6.12,<7",
]

[dependency-groups]
dev = [
    "celery-types>=0.26,<0.27",
    "django-stubs>=6.1,<7",
    "mypy>=2.3.1,<3",
    "pre-commit>=4.6.2,<5",
    "pytest>=9.1.1,<10",
    "pytest-cov>=7.1,<8",
    "pytest-django>=4.14.0,<5",
    "ruff>=0.16.9,<0.17",
]

[tool.ruff]
line-length = 100
extend-exclude = ["**/migrations"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "DJ", "S", "PT", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
# Else the two conftest.py (no __init__.py, importlib mode) clash as modules.
explicit_package_bases = true
plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]

[tool.coverage.run]
source = ["audit", "config", "core", "users"]
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
