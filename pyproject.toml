[project]
name = "muminmate"
version = "0.1.0"
description = "Grounded Quran and hadith assistant with cited, confidence-gated answers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-ninja>=1.7,<2",
    "psycopg[binary]>=3.3,<4",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
]
